name: Build RustRV

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: RustRV
  APP_VERSION: "0.2"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem -Path build -Recurse -Filter "$env:APP_NAME.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Host "Не знайдено $env:APP_NAME.exe. Усі exe у build:"
            Get-ChildItem -Path build -Recurse -Filter *.exe | ForEach-Object { Write-Host $_.FullName }
            Write-Error "Перевір, що в репозиторії лежить новий CMakeLists.txt (target RustRV)"
            exit 1
          }
          Copy-Item $exe.FullName "dist/$env:APP_NAME.exe"
          if (Test-Path font.ttf) { Copy-Item font.ttf dist/font.ttf }
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath "$env:APP_NAME-$env:APP_VERSION-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}-windows
          path: |
            dist/
            ${{ env.APP_NAME }}-${{ env.APP_VERSION }}-windows.zip

      - name: Release (тільки для тегів v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.APP_NAME }} ${{ env.APP_VERSION }}
          files: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}-windows.zip
